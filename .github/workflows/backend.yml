name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'packages/**'
      - 'Dockerfile.backend'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: jhonlz2011

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Backend Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_BACKEND_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_BACKEND_WEBHOOK secret is missing"
            exit 1
          fi
          if [ -n "$COOLIFY_TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $COOLIFY_TOKEN" "$WEBHOOK_URL"
          else
            curl -fsSL "$WEBHOOK_URL"
          fi