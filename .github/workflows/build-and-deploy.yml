name: Build and Push Images to GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  OWNER: jhonlz2011

jobs:
  # -------------------------------------------------------------
  # 1. BACKEND (Elysia / Bun)
  # -------------------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Backend Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_BACKEND_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X GET "$WEBHOOK_URL"
          else
            echo "COOLIFY_BACKEND_WEBHOOK no está configurado. Despliegue omitido."
          fi

  # -------------------------------------------------------------
  # 2. FRONTEND (SolidJS App)
  # -------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Frontend Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X GET "$WEBHOOK_URL"
          else
            echo "COOLIFY_FRONTEND_WEBHOOK no está configurado. Despliegue omitido."
          fi

  # -------------------------------------------------------------
  # 3. WEB (Landing Astro)
  # -------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web Landing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Web Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEB_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X GET "$WEBHOOK_URL"
          else
            echo "COOLIFY_WEB_WEBHOOK no está configurado. Despliegue omitido."
          fi