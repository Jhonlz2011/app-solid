name: Deploy Web Landing

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'packages/**'
      - 'Dockerfile.web'
      - 'Caddyfile.web'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: jhonlz2011

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web Landing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Web Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEB_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_WEB_WEBHOOK secret is missing"
            exit 1
          fi
          if [[ "$WEBHOOK_URL" == *"/api/v1/deploy"* ]] && [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN secret is missing for Coolify v4 API webhook"
            exit 1
          fi
          AUTH_ARGS=()
          if [ -n "$COOLIFY_TOKEN" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $COOLIFY_TOKEN")
          fi
          HTTP_RESPONSE=$(curl -sS -L -X POST \
            "${AUTH_ARGS[@]}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Zelys-Deploy/1.0" \
            -w "\nHTTP_STATUS:%{http_code}" \
            "$WEBHOOK_URL")
          HTTP_STATUS=$(printf '%s\n' "$HTTP_RESPONSE" | tail -n1 | sed 's/HTTP_STATUS://')
          HTTP_BODY=$(printf '%s\n' "$HTTP_RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Coolify deploy webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi