name: Deploy Web Landing

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'packages/**'
      - 'Dockerfile.web'
      - 'Caddyfile.web'
      - 'package.json'
      - 'bun.lock'

env:
  REGISTRY: ghcr.io
  OWNER: jhonlz2011

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web Landing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Web Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEB_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X GET "$WEBHOOK_URL"
          fi