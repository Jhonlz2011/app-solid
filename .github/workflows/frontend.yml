name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile.frontend'
      - 'Caddyfile'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: jhonlz2011

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:${{ github.sha }}
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_API_URL=https://api.zelys.app
            VITE_SSE_URL=https://api.zelys.app/api/sse
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Production Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_FRONTEND_WEBHOOK secret is missing"
            exit 1
          fi
          if [[ "$WEBHOOK_URL" == *"/api/v1/deploy"* ]] && [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN secret is missing for Coolify v4 API webhook"
            exit 1
          fi
          AUTH_ARGS=()
          if [ -n "$COOLIFY_TOKEN" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $COOLIFY_TOKEN")
          fi
          HTTP_RESPONSE=$(curl -sS -L -X POST \
            "${AUTH_ARGS[@]}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Zelys-Deploy/1.0" \
            -w "\nHTTP_STATUS:%{http_code}" \
            "$WEBHOOK_URL")
          HTTP_STATUS=$(printf '%s\n' "$HTTP_RESPONSE" | tail -n1 | sed 's/HTTP_STATUS://')
          HTTP_BODY=$(printf '%s\n' "$HTTP_RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Coolify deploy webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi