name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile.frontend'
      - 'Caddyfile'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: jhonlz2011

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:${{ github.sha }}
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_API_URL=https://api.zelys.app
            VITE_SSE_URL=https://api.zelys.app/api/sse
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Production Deploy
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_FRONTEND_WEBHOOK secret is missing"
            exit 1
          fi
          if [ -n "$COOLIFY_TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $COOLIFY_TOKEN" "$WEBHOOK_URL"
          else
            curl -fsSL "$WEBHOOK_URL"
          fi