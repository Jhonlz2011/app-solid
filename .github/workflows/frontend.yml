name: Deploy Frontend

on:
  push:
    branches:
      - main
      - feature/crud-layout-pilot
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile.frontend'
      - 'Caddyfile'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: jhonlz2011

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DOCKER_TAGS=${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:latest,${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "DOCKER_TAGS=${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:pilot,${{ env.REGISTRY }}/${{ env.OWNER }}/zelys-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.tags.outputs.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Production Deploy
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X GET "$WEBHOOK_URL"
          fi

      - name: Trigger Coolify Pilot Deploy
        if: github.ref == 'refs/heads/feature/crud-layout-pilot'
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_PILOT_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X GET "$WEBHOOK_URL"
          fi