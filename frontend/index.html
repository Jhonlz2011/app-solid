<!DOCTYPE html>
<html lang="es" >

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- Critical Theme & Anti-FOUC initialization (Frame 0 — Zero latency) -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('app-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body, #root {
      background-color: light-dark(#f4f7fb, #020617);
      color: light-dark(#0f172a, #f8fafc);
      margin: 0;
      min-height: 100vh;
    }
    html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root {
      background-color: #f4f7fb;
      color: #0f172a;
    }
    html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root {
      background-color: #020617;
      color: #f8fafc;
    }
  </style>

  <script src="/branding-fallback.js"></script>
  <meta name="description" content="Zelys — Plataforma ERP de alto rendimiento con facturación electrónica, gestión de inventarios y experiencia de usuario optimizada." />

  <link rel="preconnect" href="https://api.zelys.app" crossorigin />
  <link rel="dns-prefetch" href="https://api.zelys.app" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/logo-blank-48x48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/logo-blank-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/logo-blank-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/180.png" />
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>ERP - Sistema de Gestión</title>
</head>

<body>
  <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
  <div id="root"></div>
  <div id="portals"></div>
  <script src="/src/app.tsx" type="module"></script>
</body>

</html>
